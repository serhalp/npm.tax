allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false

minimumReleaseAge: 1080 # 18 hours
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1080 # 18 hours
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - '@opentelemetry/core@2.8.0'
  - fast-uri@3.1.4
  - sharp@0.35.0
  - tar@7.5.21
  - brace-expansion@2.1.3 || 5.0.8
